<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 970" width="920" height="970" role="img" aria-label="aflt architecture">
  <title>aflt / AgentFleet architecture</title>
  <defs>
    <filter id="sh-l" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="920" height="970" rx="16" fill="#F8FAFC"/>

  <text x="460" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Architecture</text>
  <text x="460" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">controller → aflt CLI → registry, engines, Herdr, orchestration, opt-in messaging &amp; docs</text>

  <!-- You -->
  <g filter="url(#sh-l)">
    <rect x="250" y="74" width="420" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="460" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">You / controller</text>
  <text x="460" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">terminal · script · bot</text>

  <line x1="460" y1="142" x2="460" y2="168" stroke="#64748B" stroke-width="2" marker-end="url(#arr-l)"/>

  <!-- aflt CLI -->
  <g filter="url(#sh-l)">
    <rect x="220" y="170" width="480" height="72" rx="14" fill="#FFFFFF" stroke="#0B6E6E" stroke-width="2"/>
  </g>
  <circle cx="268" cy="206" r="15" fill="#0B6E6E"/>
  <circle cx="268" cy="206" r="5.5" fill="#FFFFFF"/>
  <text x="298" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">aflt CLI</text>
  <text x="298" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0B6E6E">bin/af.js</text>

  <line x1="460" y1="242" x2="460" y2="268" stroke="#64748B" stroke-width="2" marker-end="url(#arr-l)"/>

  <!-- Registry -->
  <g filter="url(#sh-l)">
    <rect x="70" y="270" width="780" height="158" rx="14" fill="#FFFFFF" stroke="#1A3A5C" stroke-width="1.75"/>
  </g>
  <text x="92" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A3A5C">Registry</text>
  <text x="168" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">~/.agentfleet</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="100" y="320" width="168" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="184" y="342" text-anchor="middle" fill="#1E3A5F">sessions.json</text>
    <rect x="284" y="320" width="100" height="34" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="334" y="342" text-anchor="middle" fill="#115E59">runs/</text>
    <rect x="400" y="320" width="112" height="34" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="456" y="342" text-anchor="middle" fill="#115E59">results/</text>
    <rect x="528" y="320" width="100" height="34" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="578" y="342" text-anchor="middle" fill="#115E59">plans/</text>
    <rect x="644" y="320" width="176" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="732" y="342" text-anchor="middle" fill="#1E3A5F">config.json</text>

    <rect x="300" y="368" width="130" height="34" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="365" y="390" text-anchor="middle" fill="#115E59">messages/</text>
    <rect x="446" y="368" width="100" height="34" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="496" y="390" text-anchor="middle" fill="#115E59">docs/</text>
  </g>

  <line x1="180" y1="428" x2="160" y2="462" stroke="#64748B" stroke-width="1.75" marker-end="url(#arr-l)"/>
  <line x1="460" y1="428" x2="460" y2="462" stroke="#64748B" stroke-width="1.75" marker-end="url(#arr-l)"/>
  <line x1="740" y1="428" x2="760" y2="462" stroke="#64748B" stroke-width="1.75" marker-end="url(#arr-l)"/>

  <!-- Engines -->
  <g filter="url(#sh-l)">
    <rect x="40" y="468" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="175" y="498" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B6E6E">Engines</text>
  <rect x="58" y="516" width="234" height="60" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="175" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Cursor CLI</text>
  <text x="175" y="560" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0B6E6E">cursor-agent / agent</text>
  <rect x="58" y="588" width="234" height="60" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="175" y="612" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">GitHub Copilot CLI</text>
  <text x="175" y="632" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1A3A5C">copilot</text>

  <!-- Herdr -->
  <g filter="url(#sh-l)">
    <rect x="325" y="468" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="460" y="498" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A3A5C">Herdr</text>
  <rect x="343" y="514" width="234" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="460" y="539" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0F172A">herdr-core <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1A3A5C">hc</tspan> terminals</text>
  <rect x="343" y="562" width="234" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="460" y="587" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0F172A">desktop app · spaces / tabs</text>
  <rect x="343" y="610" width="234" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="460" y="635" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0F172A"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1A3A5C">af-sessions</tspan> panel mod</text>

  <!-- Orchestration -->
  <g filter="url(#sh-l)">
    <rect x="610" y="468" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="745" y="498" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B6E6E">Orchestration</text>
  <rect x="635" y="540" width="92" height="48" rx="12" fill="#0B6E6E"/>
  <text x="681" y="569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">master</text>
  <line x1="729" y1="564" x2="763" y2="564" stroke="#64748B" stroke-width="2" marker-end="url(#arr-l)"/>
  <rect x="767" y="540" width="92" height="48" rx="12" fill="#1A3A5C"/>
  <text x="813" y="569" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">workers</text>
  <text x="745" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">spawn · wait · result</text>
  <text x="745" y="646" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">send · stop · children</text>

  <line x1="175" y1="668" x2="230" y2="704" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-l)"/>
  <line x1="745" y1="668" x2="690" y2="704" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-l)"/>

  <!-- Messaging opt-in -->
  <g filter="url(#sh-l)">
    <rect x="40" y="708" width="410" height="200" rx="14" fill="#FFFFFF" stroke="#0B6E6E" stroke-width="1.75" stroke-dasharray="6 4"/>
  </g>
  <rect x="58" y="724" width="56" height="22" rx="11" fill="#CCFBF1"/>
  <text x="86" y="739" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B6E6E">opt-in</text>
  <text x="126" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Messaging</text>
  <rect x="58" y="760" width="374" height="42" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="245" y="786" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0B6E6E">aflt msg / inbox / thread</text>
  <rect x="58" y="814" width="374" height="42" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="245" y="840" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1A3A5C">aflt mcp  ·  stdio server</text>
  <text x="245" y="880" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">post_message · read_inbox · list_team</text>

  <!-- Documentarian opt-in -->
  <g filter="url(#sh-l)">
    <rect x="470" y="708" width="410" height="200" rx="14" fill="#FFFFFF" stroke="#1A3A5C" stroke-width="1.75" stroke-dasharray="6 4"/>
  </g>
  <rect x="488" y="724" width="56" height="22" rx="11" fill="#DBEAFE"/>
  <text x="516" y="739" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1A3A5C">opt-in</text>
  <text x="556" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Documentarian</text>
  <rect x="488" y="778" width="374" height="52" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="675" y="810" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#1A3A5C">aflt docs</text>
  <text x="675" y="862" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">updates configured paths</text>
  <text x="675" y="884" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1A3A5C">README.md · docs/ · CHANGELOG.md</text>

  <text x="460" y="940" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Messaging &amp; docs default off — enable via flags, aflt msg enable, or .agentfleet.json</text>
</svg>
