<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1080" width="920" height="1080" role="img" aria-label="aflt master-worker orchestration flow">
  <title>aflt master → workers orchestration</title>
  <defs>
    <filter id="osh-l" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="oarr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="920" height="1080" rx="16" fill="#F8FAFC"/>

  <text x="460" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Master → workers flow</text>
  <text x="460" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">Headless orchestrator loop — spawn, wait, result, optional messaging &amp; docs</text>

  <!-- step helper: each row ~118px -->
  <!-- 1 -->
  <g filter="url(#osh-l)">
    <rect x="70" y="74" width="780" height="96" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="118" cy="122" r="22" fill="#0B6E6E"/>
  <text x="118" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="160" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Bootstrap master</text>
  <text x="160" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0B6E6E">aflt master --goal "…" --headless</text>
  <text x="160" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">role=master · plan + result paths under ~/.agentfleet</text>

  <line x1="460" y1="170" x2="460" y2="192" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 2 -->
  <g filter="url(#osh-l)">
    <rect x="70" y="194" width="780" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="118" cy="249" r="22" fill="#0B6E6E"/>
  <text x="118" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="160" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Master spawns workers (detached)</text>
  <text x="160" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0B6E6E">aflt spawn --parent $AGENTFLEET_ID --prompt "…" --detach</text>
  <rect x="160" y="266" width="92" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="206" y="284" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B6E6E">worker A</text>
  <rect x="264" y="266" width="92" height="26" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="310" y="284" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A3A5C">worker B</text>
  <text x="380" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">supervisor records exit / handoff</text>

  <line x1="460" y1="304" x2="460" y2="326" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 3 -->
  <g filter="url(#osh-l)">
    <rect x="70" y="328" width="780" height="96" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="118" cy="376" r="22" fill="#1A3A5C"/>
  <text x="118" y="382" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="160" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Workers run · write handoffs</text>
  <text x="160" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Cursor or Copilot headless · write <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1A3A5C">$AGENTFLEET_RESULT</tspan></text>
  <text x="160" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">missing/stale after exit 0 → af-fallback from stdout</text>

  <line x1="460" y1="424" x2="460" y2="446" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 4 opt-in -->
  <g filter="url(#osh-l)">
    <rect x="70" y="448" width="780" height="96" rx="14" fill="#FFFFFF" stroke="#0B6E6E" stroke-width="1.75" stroke-dasharray="6 4"/>
  </g>
  <circle cx="118" cy="496" r="22" fill="#0B6E6E"/>
  <text x="118" y="502" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
  <rect x="160" y="464" width="56" height="20" rx="10" fill="#CCFBF1"/>
  <text x="188" y="478" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B6E6E">opt-in</text>
  <text x="228" y="479" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Workers message team</text>
  <text x="160" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0B6E6E">aflt msg</text>
  <text x="220" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">or MCP tools · workers ↔ workers / master</text>
  <text x="160" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">requires messaging enabled on the team</text>

  <line x1="460" y1="544" x2="460" y2="566" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 5 -->
  <g filter="url(#osh-l)">
    <rect x="70" y="568" width="780" height="96" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="118" cy="616" r="22" fill="#1A3A5C"/>
  <text x="118" y="622" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
  <text x="160" y="602" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Master waits</text>
  <text x="160" y="626" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1A3A5C">aflt wait --parent $AGENTFLEET_ID</text>
  <text x="160" y="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">exit 0 done · 1 failed/stopped · 2 timeout · 3 waiting</text>

  <line x1="460" y1="664" x2="460" y2="686" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 6 -->
  <g filter="url(#osh-l)">
    <rect x="70" y="688" width="780" height="88" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="118" cy="732" r="22" fill="#1A3A5C"/>
  <text x="118" y="738" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">6</text>
  <text x="160" y="722" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Read worker handoffs</text>
  <text x="160" y="746" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1A3A5C">aflt result &lt;worker&gt;</text>
  <text x="360" y="746" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">optional --require-fresh</text>

  <line x1="460" y1="776" x2="460" y2="798" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 7 -->
  <g filter="url(#osh-l)">
    <rect x="70" y="800" width="780" height="88" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <circle cx="118" cy="844" r="22" fill="#0B6E6E"/>
  <text x="118" y="850" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">7</text>
  <text x="160" y="834" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Master writes summary</text>
  <text x="160" y="858" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">final handoff to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0B6E6E">$AGENTFLEET_RESULT</tspan></text>

  <line x1="460" y1="888" x2="460" y2="910" stroke="#64748B" stroke-width="2" marker-end="url(#oarr-l)"/>

  <!-- 8 opt-in -->
  <g filter="url(#osh-l)">
    <rect x="70" y="912" width="780" height="110" rx="14" fill="#FFFFFF" stroke="#1A3A5C" stroke-width="1.75" stroke-dasharray="6 4"/>
  </g>
  <circle cx="118" cy="967" r="22" fill="#1A3A5C"/>
  <text x="118" y="973" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">8</text>
  <rect x="160" y="936" width="56" height="20" rx="10" fill="#DBEAFE"/>
  <text x="188" y="950" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1A3A5C">opt-in</text>
  <text x="228" y="951" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Auto documentarian on finish</text>
  <text x="160" y="978" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1A3A5C">aflt docs</text>
  <text x="226" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">after headless master exit 0 (or <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aflt wait --docs/tspan>)</text>
  <text x="160" y="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">when project has {"docs": true} · skip with --no-docs · once per master run</text>

  <text x="460" y="1055" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Prefer spawn --detach over shell &amp; · interactive masters use Herdr by default</text>
</svg>
